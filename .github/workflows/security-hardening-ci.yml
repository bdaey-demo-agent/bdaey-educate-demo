name: Security Hardening CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/hardening-pass-1

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore backend/BdaeyEducat.API.csproj

      - name: Build backend
        run: dotnet build backend/BdaeyEducat.API.csproj --configuration Release --no-restore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: quran-front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quran-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
