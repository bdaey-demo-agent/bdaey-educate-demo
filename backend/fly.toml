# Fly.io configuration for the Bdaey Educate ASP.NET Core API.
# Deploy from the backend directory:
#   cd backend
#   fly deploy

app = "bdaey-quran"
primary_region = "fra"

kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# Only non-sensitive production settings belong here.
# Credentials and private keys must be configured with `fly secrets set`.
[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://0.0.0.0:8080"
  DOTNET_EnableDiagnostics = "0"

  FrontendUrl = "https://bdaey.com"
  PublicApiUrl = "https://bdaey-quran.fly.dev"

  Jwt__Issuer = "BdaeyEducat"
  Jwt__Audience = "BdaeyEducat"
  Jwt__ExpireMinutes = "15"
  Jwt__RefreshTokenDays = "14"

  # White-label identity (per-academy deployments override these)
  Branding__NameAr = "بدائي"
  Branding__NameEn = "BDAEY"

  Video__Provider = "daily"
  Video__EarlyJoinMinutes = "15"
  Video__LateJoinMinutes = "30"
  Daily__Domain = "bdaey-educate.daily.co"

  SmtpSettings__Port = "587"
  SmtpSettings__EnableSsl = "true"

  # Exact frontend origins accepted by the production CORS policy.
  AllowedOrigins__0 = "https://bdaey.vercel.app"
  AllowedOrigins__1 = "https://bdaey-quran.netlify.app"
  AllowedOrigins__2 = "https://quran-front.vercel.app"
  AllowedOrigins__3 = "https://quran-front-ef296ldzx-yousef-812s-projects.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true

  # The API contains scheduled background services, so keep one Machine warm.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
  protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

# Configure private values outside GitHub, for example:
#
# fly secrets set \
#   ConnectionStrings__DefaultConnection="postgresql-connection-string" \
#   Jwt__Key="long-random-signing-key" \
#   Google__ClientId="google-oauth-client-id" \
#   DAILY_API_KEY="daily-api-key" \
#   Redis__Configuration="redis-connection-string" \
#   Kashier__MerchantId="merchant-id" \
#   Kashier__ApiKey="api-key" \
#   Kashier__SecretKey="secret-key" \
#   Kashier__Mode="test-or-live" \
#   Kashier__BaseUrl="https://checkout.kashier.io" \
#   SmtpSettings__Host="smtp-host" \
#   SmtpSettings__Email="sender-email" \
#   SmtpSettings__Password="smtp-password" \
#   AWS__AccessKey="aws-access-key" \
#   AWS__SecretKey="aws-secret-key" \
#   AWS__Region="eu-central-1" \
#   AWS__BucketName="bucket-name"
#
# Optional production administrator seeding settings:
#   Admin__Email
#   Admin__Password
