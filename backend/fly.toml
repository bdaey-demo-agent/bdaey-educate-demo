# fly.toml app configuration file for bdaey

app = "bdaey-lms-api"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true

  # Auto start/stop based on usage
  auto_stop_machines = true
  auto_start_machines = true

  # Keep at least 1 machine running to avoid cold starts
  min_machines_running = 1

  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

